# =============================================================================
# GWAS2m SLURM profile - EXAMPLE ONLY: the scheduling values that were
# hard-coded in the scripts before the configuration refactor (UQ HPC).
#
# NOT the program default. Use it explicitly:
#   python Step01_10_Run.py --phenotype migraine --ancestry EUR \
#       --slurm-config config/uq.example.yaml
# Contains no accounts, user names or filesystem paths.
#
# Before the refactor the per-step planners rejected walltimes > 24 h, while
# the shared-resource setup jobs ran on the "ascher" partition for up to 240 h;
# max_walltime is therefore left null and the long setup jobs carry their own
# partition.
# =============================================================================

scheduler: slurm

cluster:
  name: uq_example

slurm:
  partition: general
  account: null
  qos: null
  reservation: null
  constraint: null

  default_time: "24:00:00"
  default_memory: "8G"
  default_cpus: 1
  default_nodes: 1
  default_ntasks: 1

  max_parallel: 0
  array_limit: 1000
  max_walltime: null

  extra_sbatch_directives: []

stages:

  setup:
    partition: ascher
    time: "24:00:00"
    memory: "16G"
    cpus: 2
  setup_genome:
    partition: ascher
    time: "24:00:00"
    memory: "24G"
    cpus: 4
